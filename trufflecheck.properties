# trufflecheck policy overlay (https://github.com/elide-dev/trufflecheck); paths are relative to this file.
# Defaults: META-INF/trufflecheck/policy.properties in trufflecheck-errorprone. Run with `mise run check:trufflecheck`.

# Build-time class initialization, which activates TruffleHostValueInImageHeap: the runtime's own
# native-image.properties, and those the generator writes beside the cell fixtures that
# scripts/trufflecheck.py generates (build/trufflecheck/cells/<fixture>/META-INF/native-image/...).
classinit.native-image=src/truffle/resources,build/trufflecheck/cells

# Myna is not a guest language, but myna-truffle and the cells it generates run inside one: they are
# nodes in the guest's AST and hand values to it through InteropLibrary, never the embedding API.
# Scoping TruffleHostInterop to them keeps org.graalvm.polyglot out; host-side tests and fixture
# drivers (src/test, tests/truffle/*Main.java) are embedders and are not compiled by the check.
# fixture.cells is the generated cells' package in tests/truffle/cells.seam and examples/truffle.seam.
hostinterop.scope=dev.elide.myna.truffle,fixture.cells
