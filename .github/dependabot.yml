version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      containers:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /benchmarks
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /benchmarks/comparison
    schedule:
      interval: weekly
