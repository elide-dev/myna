version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      containers:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
    ignore:
      # bumpalo's allocator-api2 integration implements the 0.2 trait; a newer
      # allocator-api2 splits the trait and breaks the arena allocator.
      - dependency-name: allocator-api2
        versions: ['>=0.3']

  - package-ecosystem: maven
    directory: /benchmarks
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /benchmarks/comparison
    schedule:
      interval: weekly
