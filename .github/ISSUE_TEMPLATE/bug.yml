name: Bug report
description: Report an incorrect result or reproducible failure.
body:
  - type: markdown
    attributes:
      value: "For security-sensitive reports, use https://github.com/elide-dev/myna/security/advisories/new instead."
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Myna commit/version, OS/architecture, toolchain versions, and JVM or SVM execution.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, input seam or reduced source, expected behavior, and actual behavior. Remove secrets and private data.
    validations:
      required: true
