name: PR

"on":
  pull_request:

permissions:
  contents: read

concurrency:
  group: "pr-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/check.changes.yml

  jvm:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: JVM
    uses: ./.github/workflows/check.jvm.yml
    permissions:
      contents: read
      id-token: write

  native:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Native
    uses: ./.github/workflows/check.native.yml
    permissions:
      contents: read
      id-token: write

  containers:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Containers
    uses: ./.github/workflows/job.container.yml
    permissions:
      contents: read

  gate:
    name: Gate
    if: always()
    needs: [changes, jvm, native, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "Setup: Harden Runner"
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Require all checks to pass
        env:
          FULL: ${{ needs.changes.outputs.full }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ "$FULL" = false ]; then
            jq -e '.changes.result == "success" and ([.jvm, .native, .containers] | all(.result == "skipped"))' <<< "$RESULTS"
          else
            jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
          fi
