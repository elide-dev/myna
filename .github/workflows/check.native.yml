name: "Check - Native"

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rust-untrusted:
    name: Rust untrusted tapes (ASan fuzz, Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup tools
        uses: ./.github/actions/setup
      - name: Miri over myna-values tests
        run: mise run test:miri
      - name: ASan canary and five-minute cargo-fuzz campaigns per target
        timeout-minutes: 20
        run: mise exec -- scripts/rust-fuzz.sh 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-untrusted
          if-no-files-found: ignore
          path: |
            build/rust-fuzz/*.log
            build/rust-fuzz/**/crash-*
            build/rust-fuzz/**/oom-*
            build/rust-fuzz/**/timeout-*

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: "Setup: Harden Runner"
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Apple linker for instrumented LLVM objects
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Xcode 16.4 ld rejects fuzzer+UBSan relocations (LLVM #139684).
          # Keep pinned Clang/compiler-rt; select the platform SDK and linker.
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun ld -v
      - name: Setup tools
        uses: ./.github/actions/setup
      - name: Verify LLVM compatibility
        shell: bash
        run: |
          eval "$(mise env -s bash)"
          test "$(elide-toolchain version)" = 2026.11.6
          test "$("$LLVM_CONFIG" --version | cut -d. -f1)" = 23
          test "$(rustc -vV | awk '/LLVM version:/ {split($3, version, "."); print version[1]}')" = 23
      - name: Build native CLI and object applicator
        run: mise run build:llvm
      - name: Analyze native code for common vulnerabilities
        run: mise run check:native
      - name: Verify symbol identity failures
        run: mise exec -- python3 tests/symbols.py
      - run: mise run test:e2e
      - run: mise run test:llvm-coverage
      - run: mise run test:rust
      - name: C++ value ABI and simdjson conformance
        run: mise run test:cpp
      - run: mise run test:rust-coverage
        if: runner.os == 'Linux'
      - name: ASan, UBSan and LSan with ten-minute fuzz campaign
        timeout-minutes: 15
        env:
          MYNA_PYTHON_TIMEOUT: 14m
        run: mise exec -- scripts/python.sh tests/sanitizers.py asan --duration 600
      - run: mise run test:tsan
      - run: mise run test:native-image
      - name: Measure SVM text crossover
        run: mise exec -- python3 benchmarks/text/run.py --output build/reports/text-crossover.json
      - run: mise run bench:comparison-build
        if: runner.os == 'Linux'
      - run: mise run bench:comparison-smoke
        if: runner.os == 'Linux'
      - name: Upload native production coverage
        if: ${{ !cancelled() && hashFiles('build/reports/*.lcov') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          plugins: noop
          files: build/reports/rust.lcov,build/reports/cpp.lcov,build/reports/llvm.lcov
          disable_search: true
          flags: native-coverage-${{ matrix.os }}
          fail_ci_if_error: true
      - name: Upload native test results to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/*.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          plugins: noop
          files: build/reports/native-e2e.xml,build/reports/llvm-integration.xml,build/reports/native-image-integration.xml
          disable_search: true
          flags: native-${{ matrix.os }}
          fail_ci_if_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            build/dist/
            build/reports/
            build/sanitizers/**/*.log
            build/sanitizers/**/*.json
            build/sanitizers/**/crash-*
            build/sanitizers/**/corpus/*
            build/sanitizers/**/fuzz-values
            build/comparison/**/*.json
            build/comparison/**/*.jsonl
            build/comparison/**/*.md
            build/comparison/**/*.log
            build/comparison/**/*.asm
            build/comparison/**/*.bc
            build/comparison/**/*.ll
            build/comparison/native
            build/comparison/ffm-aot
            build/static-jni-test/*.bc
            build/static-jni-test/*.ll
            build/static-jni-test/*.txt
            build/static-jni-test/jni-app
            build/static-jni-test/generated/seam-jni.*
            build/aot-ffm-test/jni*.bc
