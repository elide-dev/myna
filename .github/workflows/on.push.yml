name: CI

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "push-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  changes:
    uses: ./.github/workflows/check.changes.yml

  jvm:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: JVM
    uses: ./.github/workflows/check.jvm.yml
    permissions:
      contents: read
      id-token: write

  native:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Native
    uses: ./.github/workflows/check.native.yml
    permissions:
      contents: read
      id-token: write

  containers:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Containers
    uses: ./.github/workflows/job.container.yml
    permissions:
      contents: read

  gate:
    name: Gate
    if: always()
    needs: [changes, jvm, native, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "Setup: Harden Runner"
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Require all checks to pass
        env:
          FULL: ${{ needs.changes.outputs.full }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ "$FULL" = false ]; then
            jq -e '.changes.result == "success" and ([.jvm, .native, .containers] | all(.result == "skipped"))' <<< "$RESULTS"
          else
            jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
          fi
