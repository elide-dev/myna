name: CodSpeed

"on":
  push:
    branches: [main]
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "codspeed-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 30
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Setup: Java"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Install CodSpeed JMH fork
        working-directory: third-party/codspeed-jvm
        run: ./gradlew -p jmh-fork publishToMavenLocal --no-daemon -q
      - name: Build benchmark JAR
        run: benchmarks/mvnw -B -q -f benchmarks/pom.xml package
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime
          run: java -jar benchmarks/target/benchmarks.jar
