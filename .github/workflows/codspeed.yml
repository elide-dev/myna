name: CodSpeed

"on":
  push:
    branches: [main]
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "codspeed-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sdk:
    uses: ./.github/workflows/job.benchmark-sdk.yml

  build-jmh:
    needs: sdk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
      - name: Build pinned CodSpeed fork for ARM64
        run: mise exec -- third-party/codspeed-jvm/gradlew -p third-party/codspeed-jvm/jmh-fork -I "$PWD/benchmarks/codspeed.init.gradle" publishToMavenLocal --no-daemon -q
      - run: mise exec -- benchmarks/mvnw -B -q -f benchmarks/pom.xml package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmh-binaries
          path: benchmarks/target/benchmarks.jar

  native-wall-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.25'
      - run: mise exec -- python3 benchmarks/native/build.py
      - run: tar -czf build/native-wall.tar.gz build/bench-native/values
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wall-binaries
          path: build/native-wall.tar.gz

  benchmarks:
    needs: build-jmh
    name: Run benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 30
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.25'
      # Elide 1.6.2's executable SIGILLs on the macro runner CPU. These harnesses
      # need the pinned JVM/compiler, not the Elide CLI or its Python component.
      - uses: ./.github/actions/setup-graalvm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jmh-binaries
          path: benchmarks/target
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime
          run: mise exec -- java -jar benchmarks/target/benchmarks.jar

  native-values:
    needs: native-wall-build
    name: Native values (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: simulation
            runner: ubuntu-24.04
          - mode: walltime
            runner: codspeed-macro
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.25'
      - run: mise exec -- python3 benchmarks/native/build.py
        if: matrix.mode == 'simulation'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.mode == 'walltime'
        with:
          name: native-wall-binaries
          path: build
      - run: tar -xzf build/native-wall.tar.gz
        if: matrix.mode == 'walltime'
      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: ${{ matrix.mode }}
          run: benchmarks/native/run.sh
