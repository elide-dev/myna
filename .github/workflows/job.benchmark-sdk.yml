name: Prepare benchmark SDK

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    # Populate the shared cache before allocating dedicated measurement hardware.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
