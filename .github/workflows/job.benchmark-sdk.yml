name: Prepare benchmark SDK

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    # Populate the shared cache before allocating dedicated measurement hardware.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
