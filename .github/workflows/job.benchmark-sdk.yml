name: Prepare benchmark SDK

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    # Populate the shared cache before allocating dedicated measurement hardware.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
