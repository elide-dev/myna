name: Prepare benchmark SDK

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    # Populate the shared cache before allocating dedicated measurement hardware.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
