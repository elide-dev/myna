name: "Check - JVM"

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "Setup: Harden Runner"
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup tools
        uses: ./.github/actions/setup
      - name: Validate workflows
        run: mise run lint
      - name: Build JVM artifacts
        run: mise run build:jvm
      - name: Run JVM tests and coverage gate
        run: mise run test:jvm
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('.dev/reports/coverage/jvm/jvm-test/jvm-test.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          plugins: noop
          files: .dev/reports/coverage/jvm/jvm-test/jvm-test.xml
          disable_search: true
          flags: jvm
          fail_ci_if_error: true
      - name: Upload JVM test results to Codecov
        if: ${{ !cancelled() && hashFiles('.dev/reports/tests/jvm/test/TEST-*.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          plugins: noop
          directory: .dev/reports/tests/jvm/test
          flags: jvm
          fail_ci_if_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jvm-reports
          include-hidden-files: true
          path: |
            .dev/reports/tests/jvm/
            .dev/reports/coverage/jvm/
