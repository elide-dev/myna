name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('target/site/jacoco/jacoco.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: target/site/jacoco/jacoco.xml
          disable_search: true
          flags: jvm
          fail_ci_if_error: true
      - name: Upload JVM test results to Codecov
        if: ${{ !cancelled() && hashFiles('target/surefire-reports/TEST-*.xml') != '' }}
        uses: codecov/test-results-action@v1
        with:
          use_oidc: true
          directory: target/surefire-reports
          flags: jvm
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            elide_asset: linux-amd64
          - os: macos-15
            elide_asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - uses: elide-dev/setup-elide@v4
        with:
          version: '1.5.4+20260921'
          custom_url: https://github.com/elide-dev/elide/releases/download/1.5.4%2B20260921/elide.${{ matrix.elide_asset }}.txz
          telemetry: 'false'
      - name: Install matching Rust
        run: |
          rustup toolchain install nightly-2026-09-16 --profile minimal
          rustup override set nightly-2026-09-16
          rustc -vV
      - name: Install LLVM 23 on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23-dev lld-23
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          echo LLVM_BIN=/usr/lib/llvm-23/bin >> "$GITHUB_ENV"
          echo LLVM_CONFIG=/usr/lib/llvm-23/bin/llvm-config >> "$GITHUB_ENV"
      - name: Install LLVM 23 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Build native CLI and object applicator
        run: scripts/build.sh --llvm
      - run: python3 tests/e2e.py
      - run: python3 tests/llvm_integration.py
      - run: python3 tests/native_image_integration.py
      - name: Upload native test results to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/*.xml') != '' }}
        uses: codecov/test-results-action@v1
        with:
          use_oidc: true
          files: build/reports/native-e2e.xml,build/reports/llvm-integration.xml,build/reports/native-image-integration.xml
          disable_search: true
          flags: native-${{ matrix.os }}
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            build/dist/
            build/reports/
