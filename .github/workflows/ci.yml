name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - uses: elide-dev/setup-elide@v4
        with:
          version: '1.5.4'
          telemetry: 'false'
      - name: Install matching Rust
        run: |
          rustup toolchain install nightly-2026-09-16 --profile minimal
          rustup override set nightly-2026-09-16
          rustc -vV
      - name: Install LLVM 23 on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23-dev lld-23
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          echo LLVM_BIN=/usr/lib/llvm-23/bin >> "$GITHUB_ENV"
          echo LLVM_CONFIG=/usr/lib/llvm-23/bin/llvm-config >> "$GITHUB_ENV"
      - name: Install LLVM 23 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Build native CLI and object applicator
        run: scripts/build.sh --llvm
      - run: python3 tests/e2e.py
      - run: python3 tests/llvm_integration.py
      - run: python3 tests/native_image_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            build/dist/
            build/reports/
