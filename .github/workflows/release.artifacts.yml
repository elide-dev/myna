name: Release artifacts and provenance

"on":
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the portable SDK and exact source archive
        id: package
        run: |
          mise run package:values
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz --prefix="myna-$version/" HEAD > "build/dist/myna-source-$version.tar.gz"
          cp LICENSE LICENSE-APACHE LICENSE-MIT THIRD_PARTY.md build/dist/
          (cd build/dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Inventory source dependencies
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          config: .syft.yaml
          syft-version: v1.56.0
          format: spdx-json
          output-file: build/dist/myna-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest artifacts built in this workflow
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/dist/*.tar.gz
      - name: Attest the source dependency inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/dist/myna-source-${{ steps.package.outputs.version }}.tar.gz
          sbom-path: build/dist/myna-source.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: build/dist/
      - name: Attach to an unpublished release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Myna $PACKAGE_VERSION"
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          # Do not replace already-published bytes or existing assets.
          gh release upload "$RELEASE_TAG" build/dist/*
