name: Boundary comparisons

"on":
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    uses: ./.github/workflows/job.benchmark-sdk.yml

  build:
    needs: sdk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
      - run: mise exec -- python3 benchmarks/comparison/run.py build
      - run: tar -czf build/comparison.tar.gz build/comparison
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison-binaries
          path: build/comparison.tar.gz

  compare:
    needs: build
    # Use compatible ARM hardware. Shared-host timings are advisory; configure
    # MYNA_ARM_BENCH_RUNNER for a controlled ARMv8.2+/SVE runner.
    runs-on: ${{ vars.MYNA_ARM_BENCH_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: comparison-binaries
          path: build
      - run: tar -xzf build/comparison.tar.gz
      - name: Measure five fresh processes per case
        run: mise exec -- python3 benchmarks/comparison/run.py run
      - name: Gate generated bindings against matched handwritten calls
        # Shared runners: code layout alone moves identical handwritten calls by up to 3.6%.
        run: python3 benchmarks/gate.py comparison build/comparison/results.json --tolerance 0.05
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: boundary-comparison
          path: |
            build/comparison/**/*.json
            build/comparison/**/*.jsonl
            build/comparison/**/*.md
            build/comparison/**/*.log
            build/comparison/**/*.asm
            build/comparison/**/*.bc
            build/comparison/**/*.ll
            build/comparison/native
            build/comparison/ffm-aot
