name: Repository hygiene

"on":
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.25'
          install_args: actionlint shellcheck
      - run: actionlint
      - run: python3 scripts/check-hygiene.py
      - run: python3 -m unittest discover -s tests -p test_publish_symbols.py
      - name: Render performance charts from retained measurements
        run: |
          python3 -m venv build/charts-venv
          build/charts-venv/bin/pip install --require-hashes -r benchmarks/comparison/requirements.txt
          build/charts-venv/bin/python benchmarks/comparison/chart.py benchmarks/comparison/baselines/hosted-arm64-0.7.2.json --output build/charts/svm-boundaries
          build/charts-venv/bin/python benchmarks/comparison/floor-chart.py --output build/charts/leaf-floor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-charts
          path: build/charts/
