name: Repository hygiene

"on":
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.25'
          install_args: actionlint shellcheck
      - name: Analyze Dockerfile security and correctness
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0 (Hadolint 2.15.1)
      - run: actionlint
      - run: python3 scripts/check-hygiene.py
      - run: python3 -m unittest discover -s tests -p test_source_notices.py
      - run: python3 -m unittest discover -s tests -p test_ci_changes.py
      - run: python3 -m unittest discover -s tests -p test_publish_symbols.py
      - run: python3 -m unittest discover -s tests -p test_build_policy.py
      - run: python3 -m unittest discover -s tests -p test_gate.py
      - name: Render performance charts from retained measurements
        run: |
          python3 -m venv build/charts-venv
          build/charts-venv/bin/pip install --require-hashes -r benchmarks/comparison/requirements.txt
          host='Threadripper PRO 9965WX · Linux x86-64'
          build/charts-venv/bin/python benchmarks/comparison/abi2-chart.py benchmarks/comparison/baselines/default-leaf-2026-11-10-linux-x86_64.json --host "$host" --date 2026-11-10 --output build/charts/default-leaf
          build/charts-venv/bin/python benchmarks/comparison/chart.py benchmarks/comparison/baselines/scalar-2026-11-10-linux-x86_64.json --host "$host" --date 2026-11-10 --output build/charts/svm-boundaries
          build/charts-venv/bin/python benchmarks/cells/chart.py benchmarks/cells/baselines/unclemax-linux-x86_64-2026-11-10.json --host "$host" --date 2026-11-10 --output build/charts/truffle-cells
          build/charts-venv/bin/python benchmarks/comparison/floor-chart.py --output build/charts/leaf-floor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-charts
          path: build/charts/
