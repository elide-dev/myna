name: Truffle cell costs

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/cells/**'
      - 'src/main/java/**'
      - 'src/truffle/**'
      - 'benchmarks/comparison/kernel.c'
      - 'tools/graalvm.json'
      - 'tools/truffle.json'
      - 'tests/support.py'
      - 'tests/truffle_integration.py'
      - '.github/workflows/benchmark.cells.yml'

permissions:
  contents: read

concurrency:
  group: cells-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cells:
    runs-on: ${{ vars.MYNA_ARM_BENCH_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.10.25'
      - uses: ./.github/actions/setup-graalvm
      - run: mise run build:jvm
      - run: mise exec -- python3 benchmarks/cells/run.py build
      - run: mise exec -- python3 benchmarks/cells/run.py run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: truffle-cell-costs
          path: |
            build/cells/*.json
            build/cells/*.md
            build/cells/*.log
            build/cells/results-logs/
