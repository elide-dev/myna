name: Setup Myna toolchain
description: Install the locked mise tools and Elide Python component
runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: '2026.10.25'
        cache_key_prefix: myna-${{ github.job }}
        cache_save_post: true
    - name: Setup Elide Python and project dependencies
      shell: bash
      run: mise run setup
