name: Build and smoke-test a container
description: Build the selected Myna image with read-only repository access
inputs:
  target:
    description: Docker build target (generator or llvm23)
    required: true
outputs:
  name:
    description: Container repository
    value: ${{ steps.image.outputs.name }}
  suffix:
    description: Tag suffix for the selected target
    value: ${{ steps.image.outputs.suffix }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.2
    - name: Image name
      id: image
      shell: bash
      env:
        IMAGE_TARGET: ${{ inputs.target }}
      run: |
        case "$IMAGE_TARGET" in generator|llvm23) ;; *) exit 1 ;; esac
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        suffix=""
        if [ "$IMAGE_TARGET" = llvm23 ]; then suffix=-llvm23; fi
        echo "name=$image" >> "$GITHUB_OUTPUT"
        echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: ${{ inputs.target }}
        load: true
        pull: true
        push: false
        tags: myna:test
        cache-from: type=gha,scope=${{ inputs.target }}
        cache-to: type=gha,mode=max,scope=${{ inputs.target }}
    - name: Smoke-test container
      shell: bash
      run: |
        docker run --rm myna:test --version
        mkdir -p build/container
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" myna:test generate examples/buffer.seam --out build/container --target x86_64-unknown-linux-gnu
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" myna:test generate examples/buffer.seam --out build/container --target x86_64-unknown-linux-gnu --check
    - name: Smoke-test object application
      if: inputs.target == 'llvm23'
      shell: bash
      run: |
        printf '%s\n' 'extern long seam_inspect(const long*); long f(void) { long x=42; seam_inspect(&x); return x; }' > build/container/caller.c
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" --entrypoint clang myna:test -O1 -flto=thin -c build/container/caller.c -o build/container/caller.o
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" myna:test apply --contracts build/container/seam.ll --input build/container/caller.o --output build/container/caller.seam.o
