min_version = "2026.10.25"

[tools]
rust = "1.99.1"
cmake = "4.4.5"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"github:taiki-e/cargo-llvm-cov" = "0.8.7"

[tools."github:elide-dev/elide"]
version = "1.6.2"
bin_path = "bin"

[tools."github:elide-dev/elide".platforms]
linux-x64 = { asset_pattern = "elide.linux-amd64.txz" }
linux-arm64 = { asset_pattern = "elide.linux-arm64.txz" }
macos-arm64 = { asset_pattern = "elide.macos-arm64.txz" }

[tools."github:elide-dev/toolchain"]
version = "2026.11.5"
bin_path = "elide-toolchain/bin"

[tools."github:elide-dev/toolchain".platforms]
linux-x64 = { asset_pattern = "elide-toolchain-2026.11.5-linux-amd64.tar.xz" }
linux-arm64 = { asset_pattern = "elide-toolchain-2026.11.5-linux-arm64.tar.xz" }
macos-arm64 = { asset_pattern = "elide-toolchain-2026.11.5-darwin-arm64.tar.xz" }

[env]
MYNA_ROOT = "{{ config_root }}"
_.source = { path = "scripts/toolchain-env.sh", tools = true }

[tasks.setup]
description = "Install Rust check tools, Elide Python, and project dependencies"
run = ["rustup component add rustfmt clippy llvm-tools-preview", "elide setup python --channel release", "scripts/python.sh scripts/setup-graalvm.py", "elide install"]

[tasks."build:jvm"]
description = "Build the CLI and hosted Feature JARs with Elide"
run = "elide build :jar :feature-jar :values-jar"

[tasks.build]
description = "Build the native CLI and JARs"
run = "scripts/build.sh"

[tasks."build:llvm"]
description = "Build the native CLI and LLVM object applicator"
run = "scripts/build.sh --llvm"

[tasks."test:jvm"]
description = "Run Elide JVM tests and enforce coverage thresholds"
run = "scripts/test-jvm.sh"

[tasks."test:e2e"]
run = "scripts/python.sh tests/e2e.py"

[tasks."test:llvm"]
run = "scripts/python.sh tests/llvm_integration.py"

[tasks."test:native-image"]
run = "scripts/python.sh tests/native_image_integration.py"

[tasks."test:rust"]
description = "Test allocator-aware Serde value mapping"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --locked -- -D warnings", "cargo test --workspace --locked"]

[tasks."bench:values"]
description = "Benchmark value tape encoding against Serde JSON representations"
run = "cargo bench --locked -p myna-values --bench encode"

[tasks.test]
description = "Build and run all JVM and native tests"
run = "scripts/test.sh"

[tasks.lint]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks."check:style"]
description = "Enforce Google Java, LLVM C/C++, and rustfmt styles"
run = "python3 scripts/quality.py style"

[tasks.format]
description = "Format maintained primary-language sources"
run = "python3 scripts/quality.py format"

[tasks."check:java"]
description = "Compile production Java with all warnings fatal"
run = "python3 scripts/quality.py java"

[tasks."check:native"]
description = "Analyze native production code for common vulnerabilities"
run = "python3 scripts/quality.py native"

[tasks."check:repeatable"]
description = "Rebuild distributables twice and compare exact bytes"
run = "python3 scripts/check-repeatable.py"

[tasks."test:cpp"]
description = "Sanitize the direct C++ producer and pinned simdjson adapter"
run = "scripts/python.sh tests/values_cpp.py"

[tasks."package:values"]
description = "Build and verify the portable Rust, C++, and SVM value SDK"
run = "scripts/package-values.sh"

[tasks."test:rust-coverage"]
description = "Measure production Rust coverage without stale or empty test binaries"
run = ["cargo llvm-cov clean --workspace", "cargo llvm-cov -p myna-values --test values --locked --lcov --output-path build/reports/rust.lcov --fail-under-lines 97.5"]

[tasks."test:asan"]
run = "scripts/python.sh tests/sanitizers.py asan"

[tasks."test:tsan"]
run = "scripts/python.sh tests/sanitizers.py tsan"

[tasks."bench:comparison-build"]
run = "scripts/python.sh benchmarks/comparison/run.py build"

[tasks."bench:comparison"]
run = "scripts/python.sh benchmarks/comparison/run.py run"

[tasks."bench:comparison-smoke"]
run = "scripts/python.sh benchmarks/comparison/run.py run --forks 1 --iterations 10000"

[tasks."bench:native-build"]
run = "scripts/python.sh benchmarks/native/build.py"

[tasks."test:llvm-coverage"]
run = "scripts/python.sh scripts/native-coverage.py"

[tasks."bench:floor-build"]
run = "scripts/python.sh benchmarks/floor/run.py build"

[tasks."bench:floor"]
run = "scripts/python.sh benchmarks/floor/run.py run"
