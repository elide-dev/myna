# libFuzzer targets for untrusted value tapes, built by cargo-fuzz with ASan
# (see `mise run test:rust-fuzz`); a separate workspace, excluded from the main one.
[package]
name = "myna-values-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
myna-values = { path = ".." }

[workspace]

[[bin]]
name = "tape_text"
path = "fuzz_targets/tape_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utf8_to_utf16"
path = "fuzz_targets/utf8_to_utf16.rs"
test = false
doc = false
bench = false

[[bin]]
name = "asan_canary"
path = "fuzz_targets/asan_canary.rs"
test = false
doc = false
bench = false
