# myna-truffle: Truffle library exports live in the image heap, so they initialize at build time.
# The empty-buffer dummy allocates native memory, the pin threshold reads a system property, the
# scratch holder owns every thread's native copy block, and the batch sentinel is a thread: all
# stay at run time so no address, thread or build-host setting is baked into the image.
Args = --initialize-at-build-time=dev.elide.myna.truffle \
       --initialize-at-run-time=dev.elide.myna.truffle.EmptyBytes,dev.elide.myna.truffle.Borrow$Threshold,dev.elide.myna.truffle.Borrow$Scratches,dev.elide.myna.truffle.BatchCoercion$Sentinel
