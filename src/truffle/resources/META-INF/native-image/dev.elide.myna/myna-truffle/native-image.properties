# myna-truffle: Truffle library exports live in the image heap, so they initialize at build time.
# The empty-buffer dummy allocates native memory and the pin threshold reads a system property;
# both stay at run time so no address or build-host setting is baked into the image.
Args = --initialize-at-build-time=dev.elide.myna.truffle \
       --initialize-at-run-time=dev.elide.myna.truffle.EmptyBytes,dev.elide.myna.truffle.Borrow$Threshold
